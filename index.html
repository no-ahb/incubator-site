<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incubator — Chiltern Street, London</title>
    <meta name="description" content="Incubator is an exhibition programme for exceptional emerging artists working in London. 2 Chiltern Street, Marylebone." />

    <!-- Brand font: preloaded so text doesn't flash a fallback serif while the
         css → @font-face chain resolves. -->
    <link rel="preload" href="css/fonts/centuryschoolbook.ttf" as="font" type="font/ttf" crossorigin />

    <link rel="stylesheet" href="css/ds.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/mockups.css" />
    <link rel="stylesheet" href="css/app.css" />

    <!-- Production React builds (dev builds are ~1 MB heavier and slower). -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Worker endpoint for the admin panel's issue tooling (js/admin.jsx).
         The public "Report an issue" button was removed; issues are now
         handled from the admin backend, which POSTs to this Worker. -->
    <script>
      window.REPORT_ISSUE_ENDPOINT = "https://incubator-report-issue.noahberrie7.workers.dev";
      window.REPORT_ISSUE_REPO = "no-ahb/incubator-site";
    </script>

    <script type="text/babel" src="js/data.jsx"></script>
    <script type="text/babel" src="js/components.jsx"></script>
    <script type="text/babel" src="js/screens.jsx"></script>
    <script type="text/babel" src="js/admin.jsx"></script>
    <script type="text/babel" src="js/app.jsx"></script>
  </body>
</html>
