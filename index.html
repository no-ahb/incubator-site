<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- PAGE_HEAD -->

    <!-- Favicon: green Century Schoolbook "I" on a white disc. The .ico carries
         16/32/48 for legacy; sizes="any" lets modern browsers prefer the crisp,
         self-contained SVG. apple-touch/manifest cover iOS + Android home screens. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Brand font: preloaded so text doesn't flash a fallback serif while the
         css → @font-face chain resolves. -->
    <link rel="preload" href="/css/fonts/centuryschoolbook.ttf" as="font" type="font/ttf" crossorigin />

    <link rel="stylesheet" href="/css/ds.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/mockups.css" />
    <link rel="stylesheet" href="/css/app.css" />

  </head>
  <body>
    <div id="root"><!-- PAGE_CONTENT --></div>
    <noscript><style>@media(max-width:720px){.inc-header__nav{display:block}.inc-header__inner{height:auto;flex-wrap:wrap;padding-top:20px;padding-bottom:20px}.inc-header__nav ul{flex-wrap:wrap;gap:16px}.inc-menu-btn{display:none}}</style></noscript>
    <!-- PAGE_SCRIPTS -->
  </body>
</html>
