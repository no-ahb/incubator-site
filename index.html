<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incubator — Chiltern Street, London</title>
    <meta name="description" content="Incubator is an exhibition programme for exceptional emerging artists working in London. 2 Chiltern Street, Marylebone." />

    <!-- Favicon: green Century Schoolbook "I" on a white disc. The .ico carries
         16/32/48 for legacy; sizes="any" lets modern browsers prefer the crisp,
         self-contained SVG. apple-touch/manifest cover iOS + Android home screens. -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- Brand font: preloaded so text doesn't flash a fallback serif while the
         css → @font-face chain resolves. -->
    <link rel="preload" href="css/fonts/centuryschoolbook.ttf" as="font" type="font/ttf" crossorigin />

    <link rel="stylesheet" href="css/ds.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/mockups.css" />
    <link rel="stylesheet" href="css/app.css" />

    <!-- Production React builds + Babel (JSX is compiled in the browser; there
         is no build step). Self-hosted, pinned by version in the filename, so
         the site never depends on a third-party CDN being up. To upgrade: drop
         the new file in js/vendor/ under its version and change the path here. -->
    <script src="js/vendor/react-18.3.1.production.min.js"></script>
    <script src="js/vendor/react-dom-18.3.1.production.min.js"></script>
    <script src="js/vendor/babel-standalone-7.29.0.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Worker endpoint for the staff admin page (js/admin.jsx): saving shows
         and page content, and filing/listing issues. -->
    <script>
      window.REPORT_ISSUE_ENDPOINT = "https://incubator-report-issue.noahberrie7.workers.dev";
    </script>

    <script type="text/babel" src="js/data.jsx"></script>
    <script type="text/babel" src="js/components.jsx"></script>
    <script type="text/babel" src="js/screens.jsx"></script>
    <script type="text/babel" src="js/admin.jsx"></script>
    <script type="text/babel" src="js/app.jsx"></script>
  </body>
</html>
