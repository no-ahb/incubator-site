name: Build and publish website
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Refresh date-based exhibition labels after London midnight in GMT/BST.
    - cron: '12 0,23 * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'assets/**') }}
          restore-keys: images-v1-${{ runner.os }}-
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
